# Import these routes in the application with:
#
#     my_vendor_web_yaml:
#         resource: '@MyVendorWebYamlBundle/config/routes.yaml'
#
# See https://symfony.com/doc/current/bundles/best_practices.html#routing

my_vendor_web_yaml_hello:
    path: '/hello/{name}'
    controller: 'my_vendor_web_yaml.controller.hello'
    methods: ['GET']
    defaults: { name: 'World' }
    requirements: { name: '\w+' }
