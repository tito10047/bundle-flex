my_vendor_yaml_kitchen_sink_hello:
    path: '/hello/{name}'
    controller: 'my_vendor_yaml_kitchen_sink.controller.hello'
    methods: ['GET', 'HEAD']

my_vendor_yaml_kitchen_sink_home:
    path: '/'
    controller: 'my_vendor_yaml_kitchen_sink.controller.hello'
