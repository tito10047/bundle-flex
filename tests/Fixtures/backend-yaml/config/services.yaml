# Services are defined explicitly: no autowiring, no autoconfiguration, private by default,
# with ids prefixed by "acme_backend_yaml." and aliases for autowiring.
#
# See https://symfony.com/doc/current/bundles/best_practices.html#services

services:
    acme_backend_yaml.greeter:
        class: Acme\BackendYamlBundle\Greeter
        arguments:
            - '%acme_backend_yaml.greeting%'

    acme_backend_yaml.command.hello:
        class: Acme\BackendYamlBundle\Command\HelloCommand
        arguments:
            - '@acme_backend_yaml.greeter'
        tags:
            - { name: 'console.command', command: 'acme-backend-yaml:hello' }

    acme_backend_yaml.event_listener.greeting_header:
        class: Acme\BackendYamlBundle\EventListener\GreetingHeaderListener
        arguments:
            - '@acme_backend_yaml.greeter'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.response', method: 'onKernelResponse', priority: 0 }

    Acme\BackendYamlBundle\GreeterInterface:
        alias: acme_backend_yaml.greeter
