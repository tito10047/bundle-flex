name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skeleton-repository:
        description: GitHub repository of the bundle skeleton used by the end-to-end tests (owner/name)
        required: false
        type: string
      skeleton-ref:
        description: Branch, tag or commit of the bundle skeleton
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The skeleton the end-to-end tests create bundles from. Override it with the
  # workflow_dispatch inputs or the SKELETON_REPOSITORY / SKELETON_REF repository variables.
  SKELETON_REPOSITORY: ${{ inputs.skeleton-repository || vars.SKELETON_REPOSITORY || 'tito10047/bundle-skeleton' }}
  SKELETON_REF: ${{ inputs.skeleton-ref || vars.SKELETON_REF || 'feat/symfony-8' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ' (lowest dependencies)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: zend.assertions=1

      # caches the downloaded packages (Composer cache directory), never vendor/
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run the tests
        run: composer test

  qa:
    name: Quality assurance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Check the coding standards
        run: composer cs

      - name: Run the static analysis
        run: composer phpstan

      # the workflows of this repository and the ones generated in the snapshots
      - name: Lint the GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml tests/Fixtures/*/.github/workflows/*.yml

      - name: Lint the shell scripts
        run: shellcheck tests/e2e/run.sh

  e2e:
    name: E2E, ${{ matrix.preset }} features, ${{ matrix.config-format }} config, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # the generated bundle must pass its tests with the lowest supported versions, and its
      # tests and quality checks with the latest ones, in every configuration format
      matrix:
        preset: [minimal, all]
        config-format: [php, php-array, yaml]
        php: ['8.2', '8.5']
        include:
          - php: '8.2'
            symfony: '7.4.*'
            dependencies: lowest
            scripts: test
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: highest
            scripts: test qa
          - preset: minimal
            all-features: '0'
          - preset: all
            all-features: '1'
    steps:
      - name: Checkout the plugin
        uses: actions/checkout@v7
        with:
          path: bundle-flex
          persist-credentials: false

      - name: Checkout the skeleton
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SKELETON_REPOSITORY }}
          ref: ${{ env.SKELETON_REF }}
          path: bundle-skeleton
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: zend.assertions=1

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      # the downloaded packages only, never vendor/
      - name: Cache the downloaded packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: e2e-composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.dependencies }}-${{ github.run_id }}
          restore-keys: e2e-composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.dependencies }}-

      - name: Create and check a bundle
        env:
          E2E_SKELETON_DIR: bundle-skeleton
          E2E_SYMFONY: ${{ matrix.symfony }}
          E2E_DEPENDENCIES: ${{ matrix.dependencies }}
          E2E_SCRIPTS: ${{ matrix.scripts }}
          BUNDLE_FLEX_NAME: acme/blog-bundle
          BUNDLE_FLEX_AUTHOR_NAME: Jane Doe
          BUNDLE_FLEX_AUTHOR_EMAIL: jane@example.com
          BUNDLE_FLEX_ALL: ${{ matrix.all-features }}
          BUNDLE_FLEX_CONFIG_FORMAT: ${{ matrix.config-format }}
        run: bundle-flex/tests/e2e/run.sh "$RUNNER_TEMP/blog-bundle"
